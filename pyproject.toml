[project]
name = "TeNe"
version = "0.1.0"
description = "A python library for tensor network simulation of quantum many-body systems."
readme = "README.md"
authors = [
    { name = "alsoblank", email = "luke.causer@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[project.scripts]
tene = "tene:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
